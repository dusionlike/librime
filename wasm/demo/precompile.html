<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rime WASM Precompile Test</title>
</head>
<body>
  <h1>Rime WASM Precompile Test</h1>
  <pre id="result">Running...</pre>
  <pre id="files"></pre>

  <script type="module">
    import { createRimeEngine } from '../src/index';

    async function run() {
      const resultEl = document.getElementById('result');

      try {
        const engine = await createRimeEngine({ wasmDir: '' });

        const state = await engine.processInput('nihao');
        if (!state.candidates || state.candidates.length === 0) {
          throw new Error('默认源词库无候选词');
        }

        engine.destroy();
        resultEl.textContent = 'success - engine created and input works';
      } catch (e) {
        resultEl.textContent = 'error: ' + e;
        console.error('测试失败:', e);
      }
    }

    run();
  </script>
</body>
</html>

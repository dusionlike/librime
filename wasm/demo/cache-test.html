<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rime WASM Cache Test</title>
</head>
<body>
  <h1>Rime WASM Cache Test</h1>
  <pre id="result">Running...</pre>
  <pre id="detail"></pre>

  <script type="module">
    import { createRimeEngine } from '../src/index';

    async function run() {
      const resultEl = document.getElementById('result');
      const detailEl = document.getElementById('detail');

      try {
        // ---- 第一次加载：带 dictVersion + 编译数据，写入缓存 ----
        resultEl.textContent = 'Phase 1: First load with dictVersion...';
        detailEl.textContent = '';

        let engine = await createRimeEngine({
          wasmDir: '',
          dictVersion: 'test-v1',
        });

        let state = await engine.processInput('nihao');
        let firstResult = state.candidates && state.candidates.length > 0 ? 'candidates ok' : 'no candidates';
        detailEl.textContent += 'First load: ' + firstResult + '\n';

        let ver = engine.getDictVersion();
        detailEl.textContent += 'dictVersion after first load: ' + ver + '\n';
        engine.destroy();

        // ---- 第二次加载：相同 dictVersion，不传 data，靠缓存恢复 ----
        resultEl.textContent = 'Phase 2: Load from cache (no data)...';

        engine = await createRimeEngine({
          wasmDir: '',
          dictVersion: 'test-v1',
        });

        ver = engine.getDictVersion();
        detailEl.textContent += 'dictVersion after cache load: ' + ver + '\n';

        state = await engine.processInput('nihao');
        if (state.candidates && state.candidates.length > 0) {
          detailEl.textContent += 'Cache load: candidates ok\n';
          resultEl.textContent = 'success - cache works';
        } else {
          throw new Error('Cache loaded but no candidates');
        }

        engine.destroy();
      } catch (e) {
        resultEl.textContent = 'error: ' + e;
        console.error('Cache test failed:', e);
      }
    }

    run();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rime WASM Cache Scenarios Test</title>
</head>
<body>
  <h1>Rime WASM Cache Scenarios Test</h1>
  <pre id="result">Running...</pre>
  <pre id="detail"></pre>

  <script type="module">
    import { createRimeEngine } from '../src/index';

    async function run() {
      const resultEl = document.getElementById('result');
      const detailEl = document.getElementById('detail');
      let allPassed = true;

      function log(msg) {
        detailEl.textContent += msg + '\n';
      }

      // ---- Test 1: 无 dictVersion 且无缓存，裸初始化 ----
      try {
        log('Test 1: 裸初始化 (no dictVersion, no data)...');

        const engine = await createRimeEngine({ wasmDir: '' });
        const ver = engine.getDictVersion();
        log('  getDictVersion = ' + ver);
        // 没有缓存过，version 应为 null
        if (ver === null) {
          log('  PASS: no version (expected)');
        } else {
          log('  WARN: version is ' + ver + ' (may be from previous tests)');
        }
        await engine.processInput('nihao'); // 不崩溃即可
        log('  processInput did not crash \u2192 PASS');
        engine.destroy();
      } catch (e) {
        allPassed = false;
        log('  FAIL: ' + e.message);
      }

      // ---- Test 2: 带 dictVersion 初始化，写入缓存 ----
      try {
        log('Test 2: 带 dictVersion 初始化...');

        let engine = await createRimeEngine({
          wasmDir: '',
          dictVersion: 'scenario-v2',
        });

        let ver = engine.getDictVersion();
        log('  dictVersion = ' + ver);
        if (ver !== 'scenario-v2') throw new Error('版本不匹配: ' + ver);

        let state = await engine.processInput('nihao');
        if (!state.candidates || state.candidates.length === 0) throw new Error('无候选词');
        log('  candidates ok \u2192 PASS');
        engine.destroy();
      } catch (e) {
        allPassed = false;
        log('  FAIL: ' + e.message);
      }

      // ---- Test 3: 相同 dictVersion，不传 data，从缓存加载 ----
      try {
        log('Test 3: 从缓存加载 (same dictVersion, no data)...');

        let engine = await createRimeEngine({
          wasmDir: '',
          dictVersion: 'scenario-v2',
        });

        let ver = engine.getDictVersion();
        log('  dictVersion = ' + ver);
        if (ver !== 'scenario-v2') throw new Error('版本不匹配: ' + ver);

        let state = await engine.processInput('nihao');
        if (!state.candidates || state.candidates.length === 0) throw new Error('无候选词');
        log('  candidates ok \u2192 PASS');
        engine.destroy();
      } catch (e) {
        allPassed = false;
        log('  FAIL: ' + e.message);
      }

      // ---- Test 4: 不同 dictVersion，应重新加载（不依赖缓存） ----
      try {
        log('Test 4: 不同 dictVersion（应命中缓存，版本变了还是重新加载...）');

        // 新 version 且传 data，应覆盖缓存
        let engine = await createRimeEngine({
          wasmDir: '',
          dictVersion: 'scenario-v3',
        });

        let ver = engine.getDictVersion();
        log('  dictVersion after scenario-v3 init = ' + ver);
        if (ver !== 'scenario-v3') throw new Error('版本不匹配: ' + ver);

        let state = await engine.processInput('nihao');
        if (!state.candidates || state.candidates.length === 0) throw new Error('无候选词');
        log('  candidates ok \u2192 PASS');
        engine.destroy();
      } catch (e) {
        allPassed = false;
        log('  FAIL: ' + e.message);
      }

      // ---- Test 5: 多次 destroy + create 验证引擎可复用 ----
      try {
        log('Test 5: 多次 destroy/create 循环...');

        for (let i = 0; i < 3; i++) {
          let engine = await createRimeEngine({
            wasmDir: '',
            dictVersion: 'scenario-v3',
          });

          let state = await engine.processInput('shi');
          if (!state.candidates || state.candidates.length === 0) throw new Error('第 ' + (i+1) + ' 次无候选词');
          engine.destroy();
        }
        log('  3 次循环均正常 \u2192 PASS');
      } catch (e) {
        allPassed = false;
        log('  FAIL: ' + e.message);
      }

      // ---- Summary ----
      if (allPassed) {
        resultEl.textContent = 'success - all cache scenario tests passed';
      } else {
        resultEl.textContent = 'partial - some tests had issues (see detail)';
      }
    }

    run();
  </script>
</body>
</html>
